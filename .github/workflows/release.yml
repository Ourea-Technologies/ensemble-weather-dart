# SPDX-License-Identifier: BSD-2-Clause
# Tag vX.Y.Z on main: re-run CI on the tagged commit, publish to pub.dev
# through automated publishing (GitHub OIDC, no stored token), then create the
# GitHub release from the changelog section.
#
# pub.dev accepts the OIDC token only from a workflow started by pushing a
# tag that matches the package's tag pattern (v{{version}}), from the
# repository and environment configured on the package's admin page.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to pub.dev (automated publishing, OIDC)
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pub.dev
      url: https://pub.dev/packages/ensemble_weather
    permissions:
      contents: read
      id-token: write # the pub.dev OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag names the package version
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(sed -n 's/^version: //p' pubspec.yaml)" = "$TAG"
      # pub.dev enables automated publishing only on a package that exists,
      # so the first version is published by hand; the tag then only makes
      # the GitHub release.
      - name: Is this version already on pub.dev?
        id: existing
        env:
          TAG: ${{ github.ref_name }}
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' "https://pub.dev/api/packages/ensemble_weather/versions/${TAG#v}")"
          if [ "$status" = "200" ]; then echo "published=true" >> "$GITHUB_OUTPUT"; else echo "published=false" >> "$GITHUB_OUTPUT"; fi
      # setup-dart configures the pub.dev OIDC credential when the job may
      # request an id-token.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - run: dart pub get --enforce-lockfile
      - run: dart pub publish --dry-run
      - name: Publish
        if: steps.existing.outputs.published != 'true'
        run: dart pub publish --force

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
