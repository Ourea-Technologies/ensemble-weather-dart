# SDK-STANDARD: dart analyze --fatal-infos with package:lints recommended and
# strict casts, inference and raw types; avoid_dynamic_calls for security.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - spec/**
    - .work/**

linter:
  rules:
    - avoid_dynamic_calls
    - always_declare_return_types
    - prefer_final_fields
    - prefer_final_locals
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - public_member_api_docs
    - type_annotate_public_apis
    - directives_ordering
    - prefer_single_quotes
    - test_types_in_equals
    - unnecessary_lambdas
